<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioCLIP 2 — 识别 + 配图推荐</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117; color: #e8eaf0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; padding: 36px 16px;
    }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: #4ade80; }
    header p { margin-top: 6px; color: #9ca3af; font-size: 0.9rem; }

    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab-btn {
      background: #1c1f2e; border: 1px solid #2d3148; color: #9ca3af;
      border-radius: 999px; padding: 8px 20px; font-size: 0.9rem; cursor: pointer;
      font-weight: 600; transition: all 0.15s;
    }
    .tab-btn.active { background: #16a34a; border-color: #16a34a; color: #fff; }

    .panel { display: none; width: 100%; max-width: 860px; }
    .panel.active { display: block; }

    .card {
      background: #1c1f2e; border: 1px solid #2d3148; border-radius: 16px;
      padding: 24px; width: 100%;
    }

    /* ── 识别：上传区 ── */
    #drop-zone {
      border: 2px dashed #374151; border-radius: 12px; padding: 36px 20px;
      text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s;
    }
    #drop-zone.over { border-color: #4ade80; background: rgba(74, 222, 128, 0.05); }
    #drop-zone svg { color: #6b7280; margin-bottom: 12px; }
    #drop-zone p { color: #9ca3af; font-size: 0.9rem; }
    #drop-zone p strong { color: #d1d5db; }
    #file-input { display: none; }
    #preview-wrap { display: none; margin-top: 18px; position: relative; }
    #preview-wrap img {
      width: 100%; max-height: 300px; object-fit: contain; border-radius: 10px; background: #111827;
    }
    #clear-btn {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6);
      border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer;
      color: #fff; font-size: 1rem; line-height: 28px; text-align: center;
    }

    .controls { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
    .controls label { color: #9ca3af; font-size: 0.82rem; white-space: nowrap; }
    input[type="number"], input[type="text"], select {
      background: #111827; border: 1px solid #374151; border-radius: 8px;
      color: #e8eaf0; padding: 7px 10px; font-size: 0.88rem;
    }
    input[type="number"] { width: 64px; }
    #species-input { flex: 1; min-width: 220px; }
    .btn-go {
      background: #16a34a; color: #fff; border: none; border-radius: 10px;
      padding: 10px 22px; font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn-go:hover:not(:disabled) { background: #15803d; }
    .btn-go:disabled { background: #374151; cursor: not-allowed; }

    .parts-row { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
    .parts-row label { display: flex; align-items: center; gap: 5px; color: #d1d5db; font-size: 0.85rem; cursor: pointer; }

    /* ── 物种自动补全（iNaturalist）── */
    .species-wrap { position: relative; flex: 1; min-width: 220px; }
    .species-wrap #species-input { width: 100%; }
    #species-drop {
      display: none; position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px);
      background: #111827; border: 1px solid #374151; border-radius: 10px; overflow: hidden;
      max-height: 320px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .ac-row {
      padding: 8px 12px; cursor: pointer; display: flex; align-items: baseline; gap: 8px;
      border-bottom: 1px solid #1f2937;
    }
    .ac-row:last-child { border-bottom: none; }
    .ac-row.sel, .ac-row:hover { background: #1c2536; }
    .ac-row.dim { opacity: 0.5; }
    .ac-common { color: #e8eaf0; font-size: 0.86rem; }
    .ac-sci { color: #9ca3af; font-style: italic; font-size: 0.8rem; }
    .ac-badge { margin-left: auto; font-size: 0.68rem; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
    .ac-badge.in { background: #14532d; color: #4ade80; }
    .ac-badge.out { background: #1f1f1f; color: #6b7280; }
    .ac-hint { padding: 7px 12px; color: #6b7280; font-size: 0.78rem; }

    #spinner, #rec-spinner {
      display: none; text-align: center; margin-top: 22px; color: #9ca3af; font-size: 0.9rem;
    }
    .dot-anim::after { content: ''; animation: dots 1.4s infinite; }
    @keyframes dots { 0%{content:'';} 33%{content:'.';} 66%{content:'..';} 100%{content:'...';} }

    #error-box, #rec-error {
      display: none; margin-top: 18px; background: #450a0a; border: 1px solid #991b1b;
      border-radius: 10px; padding: 13px 16px; font-size: 0.86rem; color: #fca5a5;
    }
    #rec-error .sugg { margin-top: 6px; }
    #rec-error .sugg a { color: #7fb2ff; cursor: pointer; margin-right: 10px; }

    /* ── 识别结果 ── */
    #results { margin-top: 24px; }
    #results h2, .part-block h3 {
      font-size: 0.95rem; font-weight: 600; color: #9ca3af; margin-bottom: 12px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .result-item {
      background: #111827; border: 1px solid #1f2937; border-radius: 12px;
      padding: 14px 16px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .result-item.rank-1 { border-color: #16a34a44; background: #052e1644; }
    .result-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .rank-badge { font-size: 0.75rem; font-weight: 700; color: #6b7280; min-width: 24px; }
    .rank-1 .rank-badge { color: #4ade80; }
    .sci-name { font-style: italic; font-size: 0.98rem; font-weight: 600; flex: 1; color: #f0fdf4; }
    .conf-badge { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .conf-high { background: #14532d; color: #4ade80; }
    .conf-medium { background: #451a03; color: #fb923c; }
    .conf-low { background: #1f1f1f; color: #6b7280; }
    .sim-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .sim-bar-bg { flex: 1; height: 4px; background: #1f2937; border-radius: 2px; overflow: hidden; }
    .sim-bar-fill { height: 100%; border-radius: 2px; background: #4ade80; transition: width 0.4s ease; }
    .sim-pct { font-size: 0.8rem; color: #9ca3af; min-width: 42px; text-align: right; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 4px; }
    .meta-item { font-size: 0.78rem; color: #6b7280; }
    .meta-item span { color: #d1d5db; }
    .use-for-rec {
      margin-left: 8px; font-size: 0.72rem; background: #1e293b; color: #7dd3fc;
      border: 1px solid #334155; border-radius: 6px; padding: 2px 8px; cursor: pointer;
    }

    /* ── 推荐结果网格 ── */
    .part-block { margin-top: 22px; }
    .part-block .summary { font-size: 0.8rem; color: #6b7280; margin: -6px 0 12px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px;
    }
    .pcard {
      background: #111827; border: 1px solid #1f2937; border-radius: 10px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .pcard a { display: block; }
    .pcard img { width: 100%; height: 150px; object-fit: cover; display: block; background: #0b0d11; }
    .pcard .cap { padding: 8px 10px; font-size: 0.75rem; }
    .pcard .cap .sp { font-style: italic; font-weight: 600; color: #f0fdf4; }
    .tag { display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 0.68rem; margin-left: 4px; }
    .tag.exact { background: #14532d; color: #4ade80; }
    .tag.genusrelative { background: #451a03; color: #fbbf24; }
    .tag.lookalike { background: #3a1d1d; color: #f79a9a; }
    .pcard .nums { color: #6b7280; margin-top: 3px; font-size: 0.7rem; line-height: 1.5; }
  </style>
</head>
<body>

<header>
  <h1>BioCLIP <span>2</span></h1>
  <p>植物识别 + 配图推荐</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="identify">识别</button>
  <button class="tab-btn" data-tab="recommend">配图推荐</button>
</div>

<!-- ═══════════ 识别 ═══════════ -->
<div class="panel active" id="panel-identify">
  <div class="card">
    <div id="drop-zone">
      <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5
                 m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
      </svg>
      <p><strong>点击上传</strong>或将图片拖拽到此处</p>
      <p style="margin-top:6px;font-size:0.8rem;">JPG · PNG · WebP · HEIC</p>
      <input type="file" id="file-input" accept="image/*" />
    </div>

    <div id="preview-wrap">
      <img id="preview-img" src="" alt="预览" />
      <button id="clear-btn" title="清除">✕</button>
    </div>

    <div class="controls">
      <label for="topk">Top‑K</label>
      <input type="number" id="topk" value="5" min="1" max="20" />
      <button id="submit-btn" class="btn-go" disabled>识别</button>
    </div>

    <div id="spinner"><span class="dot-anim">识别中</span></div>
    <div id="error-box"></div>
    <div id="results"></div>
  </div>
</div>

<!-- ═══════════ 配图推荐 ═══════════ -->
<div class="panel" id="panel-recommend">
  <div class="card">
    <div class="controls">
      <div class="species-wrap">
        <input type="text" id="species-input" placeholder="物种名（支持常用名，如 red maple / 红枫）" autocomplete="off" />
        <div id="species-drop"></div>
      </div>
      <button id="rec-btn" class="btn-go">推荐</button>
    </div>

    <div class="parts-row" id="parts-row">
      <label><input type="checkbox" value="leaf" checked /> leaf</label>
      <label><input type="checkbox" value="flower" checked /> flower</label>
      <label><input type="checkbox" value="fruit" checked /> fruit</label>
      <label><input type="checkbox" value="bark" checked /> bark</label>
      <label><input type="checkbox" value="stem" checked /> stem</label>
    </div>

    <div class="controls" style="margin-top:12px;">
      <label for="rec-topk">每部位</label>
      <input type="number" id="rec-topk" value="12" min="1" max="40" />
      <label for="t-sp" title="物种 softmax 温度：调大 → 近亲更容易浮上来">T_种</label>
      <input type="number" id="t-sp" value="0.01" min="0.003" max="0.3" step="0.005" style="width:78px;" />
      <label for="t-org" title="器官 logit 温度：<1 锐化(错器官→0)，>1 软化">T_器官</label>
      <input type="number" id="t-org" value="1.0" min="0.1" max="5" step="0.1" style="width:70px;" />
      <label for="pool-k" title="ANN 候选深度">pool_k</label>
      <input type="number" id="pool-k" value="1000" min="200" max="3000" step="100" style="width:78px;" />
    </div>

    <div id="rec-spinner"><span class="dot-anim">检索中</span></div>
    <div id="rec-error"></div>
    <div id="rec-meta" style="margin-top:16px;color:#9ca3af;font-size:0.85rem;"></div>
    <div id="rec-results"></div>
  </div>
</div>

<script>
// ── tab 切换 ──
document.querySelectorAll('.tab-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('panel-' + b.dataset.tab).classList.add('active');
  });
});
function switchTab(name) {
  document.querySelector(`.tab-btn[data-tab="${name}"]`).click();
}

/* ═══════════ 识别 ═══════════ */
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const previewWrap = document.getElementById('preview-wrap');
const previewImg = document.getElementById('preview-img');
const clearBtn = document.getElementById('clear-btn');
const submitBtn = document.getElementById('submit-btn');
const spinner = document.getElementById('spinner');
const errorBox = document.getElementById('error-box');
const resultsDiv = document.getElementById('results');
const topkInput = document.getElementById('topk');
let selectedFile = null;

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) setFile(f);
});
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

function setFile(file) {
  selectedFile = file;
  previewImg.src = URL.createObjectURL(file);
  previewWrap.style.display = 'block';
  submitBtn.disabled = false;
  clearResults();
}
clearBtn.addEventListener('click', () => {
  selectedFile = null; previewImg.src = ''; previewWrap.style.display = 'none';
  submitBtn.disabled = true; fileInput.value = ''; clearResults();
});
function clearResults() { resultsDiv.innerHTML = ''; errorBox.style.display = 'none'; }

submitBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  clearResults(); spinner.style.display = 'block'; submitBtn.disabled = true;
  const fd = new FormData(); fd.append('file', selectedFile);
  try {
    const topk = parseInt(topkInput.value) || 5;
    const res = await fetch(`/predict?topk=${topk}`, { method: 'POST', body: fd });
    const text = await res.text();
    if (!res.ok) {
      let d = `服务器错误 HTTP ${res.status}`;
      try { d = JSON.parse(text).detail || d; } catch {}
      showError(d); return;
    }
    renderResults(JSON.parse(text));
  } catch (e) { showError(`请求失败：${e.message}`); }
  finally { spinner.style.display = 'none'; submitBtn.disabled = false; }
});
function showError(msg) { errorBox.textContent = `⚠ ${msg}`; errorBox.style.display = 'block'; }

function renderResults(data) {
  const results = data.results ?? data;
  const gc = data.genus_confidence ?? null;
  if (!results || results.length === 0) {
    resultsDiv.innerHTML = '<p style="color:#6b7280;font-size:.9rem;">无结果</p>'; return;
  }
  const confLabel = { high: '高置信度', medium: '中置信度', low: '低置信度' };
  const metaKeys = [
    ['common_names', '常用名'], ['taxon_paths', '分类路径'], ['genera', '属'],
    ['families', '科'], ['kingdoms', '界'], ['taxon_ids', 'Taxon ID'],
  ];
  let html = '<h2>识别结果</h2>';
  if (gc) {
    const c = gc.confidence_pct >= 75 ? '#4ade80' : gc.confidence_pct >= 50 ? '#facc15' : '#f87171';
    html += `<div style="background:#12181f;border:1px solid #2d3148;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;">
      <div style="font-size:.8rem;color:#9ca3af;white-space:nowrap;">属级置信度</div>
      <div style="font-weight:700;">${gc.genus}</div>
      <div style="flex:1;background:#1f2937;border-radius:4px;height:6px;overflow:hidden;">
        <div style="width:${gc.confidence_pct}%;height:100%;background:${c};border-radius:4px;"></div></div>
      <div style="font-weight:700;color:${c};white-space:nowrap;">${gc.confidence_pct}%</div>
      <div style="font-size:.75rem;color:#6b7280;">${gc.count}/${gc.out_of}</div></div>`;
  }
  for (const r of results) {
    const isTop = r.rank === 1;
    const conf = r.confidence || 'low';
    const barW = Math.min(100, (r.similarity_pct / 50) * 100).toFixed(1);
    const sciName = r.sci_names || r.scientific_name || '未知物种';
    let metaHtml = '';
    for (const [k, label] of metaKeys) {
      const v = r[k];
      if (v && String(v) !== 'null') metaHtml += `<div class="meta-item">${label}：<span>${v}</span></div>`;
    }
    html += `<div class="result-item ${isTop ? 'rank-1' : ''}">
      <div class="result-header">
        <span class="rank-badge">#${r.rank}</span>
        <span class="sci-name">${sciName}</span>
        <button class="use-for-rec" data-sp="${sciName}">配图 →</button>
        <span class="conf-badge conf-${conf}">${confLabel[conf]}</span>
      </div>
      <div class="sim-bar-wrap">
        <div class="sim-bar-bg"><div class="sim-bar-fill" style="width:${barW}%"></div></div>
        <span class="sim-pct">${r.similarity_pct}%</span>
      </div>
      ${metaHtml ? `<div class="meta-row">${metaHtml}</div>` : ''}
    </div>`;
  }
  resultsDiv.innerHTML = html;
  resultsDiv.querySelectorAll('.use-for-rec').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('species-input').value = btn.dataset.sp;
      switchTab('recommend');
      runRecommend();
    });
  });
}

/* ═══════════ 配图推荐 ═══════════ */
const speciesInput = document.getElementById('species-input');
const recBtn = document.getElementById('rec-btn');
const recSpinner = document.getElementById('rec-spinner');
const recError = document.getElementById('rec-error');
const recMeta = document.getElementById('rec-meta');
const recResults = document.getElementById('rec-results');

// ── 图集里可查的 20k 物种集合（用来标注 iNat 建议是否可服务）──
let poolSet = new Set();
let poolList = [];
fetch('/recommend/species').then(r => r.ok ? r.json() : []).then(list => {
  poolList = list; poolSet = new Set(list.map(s => s.toLowerCase()));
}).catch(() => {});

// ── 物种自动补全：live 查 iNaturalist taxa autocomplete ──
const drop = document.getElementById('species-drop');
let acItems = [], acSel = -1, acTimer = null, acSeq = 0;

function hideDrop() { drop.style.display = 'none'; acSel = -1; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function acQuery(q) {
  const seq = ++acSeq;
  let results = [];
  try {
    const r = await fetch('https://api.inaturalist.org/v1/taxa/autocomplete?per_page=15&is_active=true&rank=species,genus,subspecies,variety&q=' + encodeURIComponent(q));
    if (r.ok) results = (await r.json()).results || [];
  } catch {}
  if (seq !== acSeq) return;                                  // 过期响应丢弃
  // iNat 没结果 → 退回本地 20k 子串匹配
  if (!results.length && poolList.length) {
    const ql = q.toLowerCase();
    results = poolList.filter(s => s.toLowerCase().includes(ql)).slice(0, 15).map(s => ({ name: s }));
  }
  // 图集内的排前面
  const rows = results.map(t => ({
    name: t.name,
    common: t.preferred_common_name || '',
    inPool: poolSet.has((t.name || '').toLowerCase()),
  }));
  rows.sort((a, b) => (b.inPool - a.inPool));
  renderDrop(rows);
}

function renderDrop(rows) {
  acItems = rows; acSel = -1;
  if (!rows.length) { drop.innerHTML = '<div class="ac-hint">无匹配</div>'; drop.style.display = 'block'; return; }
  drop.innerHTML = rows.map((x, i) => `
    <div class="ac-row ${x.inPool ? '' : 'dim'}" data-i="${i}">
      ${x.common ? `<span class="ac-common">${esc(x.common)}</span>` : ''}
      <span class="ac-sci">${esc(x.name)}</span>
      <span class="ac-badge ${x.inPool ? 'in' : 'out'}">${x.inPool ? '图集内' : '仅近似'}</span>
    </div>`).join('');
  drop.querySelectorAll('.ac-row').forEach(el => {
    el.addEventListener('mousedown', e => { e.preventDefault(); pick(+el.dataset.i); });
  });
  drop.style.display = 'block';
}

function pick(i) {
  const x = acItems[i]; if (!x) return;
  speciesInput.value = x.name;
  hideDrop();
  runRecommend();   // 图集内 → 本种照片；图集外(识图认得) → 全 look-alike / genus-relative
}

speciesInput.addEventListener('input', () => {
  const q = speciesInput.value.trim();
  clearTimeout(acTimer);
  if (q.length < 2) { hideDrop(); return; }
  acTimer = setTimeout(() => acQuery(q), 250);
});
speciesInput.addEventListener('keydown', e => {
  if (drop.style.display === 'block' && acItems.length) {
    if (e.key === 'ArrowDown') { e.preventDefault(); acSel = Math.min(acSel + 1, acItems.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); acSel = Math.max(acSel - 1, 0); }
    else if (e.key === 'Enter' && acSel >= 0) { e.preventDefault(); pick(acSel); return; }
    else if (e.key === 'Escape') { hideDrop(); return; }
    else { if (e.key === 'Enter') { hideDrop(); runRecommend(); } return; }
    drop.querySelectorAll('.ac-row').forEach((el, i) => el.classList.toggle('sel', i === acSel));
    return;
  }
  if (e.key === 'Enter') runRecommend();
});
speciesInput.addEventListener('blur', () => setTimeout(hideDrop, 150));

recBtn.addEventListener('click', () => { hideDrop(); runRecommend(); });

async function runRecommend() {
  const species = speciesInput.value.trim();
  if (!species) return;
  const parts = [...document.querySelectorAll('#parts-row input:checked')].map(x => x.value);
  const body = {
    species,
    parts: parts.length ? parts : undefined,
    topk: parseInt(document.getElementById('rec-topk').value) || 12,
    t_sp: parseFloat(document.getElementById('t-sp').value) || 0.01,
    t_org: parseFloat(document.getElementById('t-org').value) || 1.0,
    pool_k: parseInt(document.getElementById('pool-k').value) || 1000,
  };
  recError.style.display = 'none'; recMeta.textContent = ''; recResults.innerHTML = '';
  recSpinner.style.display = 'block'; recBtn.disabled = true;
  try {
    const res = await fetch('/recommend', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    });
    const text = await res.text();
    if (!res.ok) {
      let msg = `HTTP ${res.status}`, sugg = [];
      try {
        const d = JSON.parse(text).detail;
        if (typeof d === 'string') msg = d;
        else if (d) { msg = d.error || msg; sugg = d.suggest || []; }
      } catch {}
      recError.innerHTML = `⚠ ${msg}` + (sugg.length
        ? `<div class="sugg">试试：${sugg.map(s => `<a data-sp="${s}">${s}</a>`).join('')}</div>` : '');
      recError.style.display = 'block';
      recError.querySelectorAll('a[data-sp]').forEach(a =>
        a.addEventListener('click', () => { speciesInput.value = a.dataset.sp; runRecommend(); }));
      return;
    }
    renderRec(JSON.parse(text));
  } catch (e) {
    recError.textContent = `⚠ 请求失败：${e.message}`; recError.style.display = 'block';
  } finally { recSpinner.style.display = 'none'; recBtn.disabled = false; }
}

function renderRec(data) {
  recMeta.innerHTML = `<b style="color:#e8eaf0;">${data.species}</b>` +
    (data.not_in_pool ? ' · <span style="color:#fbbf24;">图集无此种的照片，以下为近似种 / 同属</span>' : '') +
    ` · T_种=${data.params.t_sp} · T_器官=${data.params.t_org} · pool_k=${data.params.pool_k}`;
  const order = ['leaf', 'flower', 'fruit', 'bark', 'stem'];
  let html = '';
  for (const part of order) {
    const lst = data.results[part];
    if (!lst) continue;
    const c = { exact: 0, 'genus-relative': 0, 'look-alike': 0 };
    lst.forEach(x => { c[x.provenance.split(' ')[0]]++; });
    html += `<div class="part-block"><h3>${part}</h3>
      <div class="summary">${lst.length} 张 · exact ${c.exact} / genus ${c['genus-relative']} / look-alike ${c['look-alike']}</div>
      <div class="grid">`;
    for (const x of lst) {
      const p = x.provenance.split(' ')[0].replace('-', '');
      html += `<div class="pcard">
        <a href="${x.url}" target="_blank" rel="noopener"><img loading="lazy" src="${x.url}" alt="${x.species}" /></a>
        <div class="cap">
          <span class="sp">${x.species}</span><span class="tag ${p}">${x.provenance.split(' ')[0]}</span>
          <div class="nums">score ${x.score} · cos ${x.cos}<br>P(种) ${x.p_species} · p_${part} ${x.p_organ}</div>
        </div></div>`;
    }
    html += `</div></div>`;
  }
  recResults.innerHTML = html || '<p style="color:#6b7280;font-size:.9rem;">无结果</p>';
}
</script>
</body>
</html>
